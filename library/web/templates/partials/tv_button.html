{% import "macros/ui.html" as ui %}
{# Toggles whether the TV account can see a show; the response is this button again. #}
<button type="button" class="btn btn-icon {{ 'btn-active' if hidden }}" hx-post="/library/shows/{{ show_id }}/tv-access"
        hx-vals='{"hidden": {{ "false" if hidden else "true" }}}' hx-swap="outerHTML" hx-disabled-elt="this"
        aria-pressed="{{ 'true' if hidden else 'false' }}"
        title="{{ 'Hidden on TV: click to show it again' if hidden else 'Hide from the TV account' }}"
        aria-label="{{ 'Show on TV' if hidden else 'Hide on TV' }}">{{ ui.icon("eye-off" if hidden else "tv") }}</button>
