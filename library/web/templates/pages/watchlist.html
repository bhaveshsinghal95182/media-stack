{% extends "base.html" %}
{% block content %}
<div data-filter-scope>
  <div class="toolbar">
    <div class="seg" role="radiogroup" aria-label="Show">
      <label><input type="radio" name="wl-kind" value="all" data-filter-kind checked>All</label>
      <label><input type="radio" name="wl-kind" value="movie" data-filter-kind>Movies</label>
      <label><input type="radio" name="wl-kind" value="show" data-filter-kind>Shows</label>
    </div>
    <label class="input-icon grow">
      {{ ui.icon("search") }}
      <input type="search" class="input" placeholder="Filter the watchlist…" data-filter-text aria-label="Filter the watchlist">
    </label>
    <button type="button" class="btn btn-icon" title="New playlist" aria-label="New playlist"
            hx-get="/watchlist/playlists/new" hx-target="#dialog-body">{{ ui.icon("folder-plus") }}</button>
    <button type="button" class="btn btn-icon" title="Select all" aria-label="Select all"
            data-select-all="#watchlist-list">{{ ui.icon("check") }}</button>
    <button type="button" class="btn btn-icon" title="Add selected to a playlist" aria-label="Add selected to a playlist"
            disabled data-selection="#watchlist-list" hx-get="/watchlist/assign"
            hx-include="#watchlist-list input[name=key]:checked" hx-target="#dialog-body">{{ ui.icon("folder") }}</button>
    <button type="button" class="btn btn-primary" disabled data-selection="#watchlist-list"
            hx-post="/watchlist/send" hx-include="#watchlist-list input[name=key]:checked" hx-target="#dialog-body"
            title="Download the selected movies" aria-label="Download the selected movies">
      {{ ui.icon("download") }}<span data-count></span></button>
  </div>
  <div id="watchlist-list" class="mt-4" hx-get="/watchlist/list" hx-trigger="load, watchlist-changed from:body">
    {{ ui.loading() }}
  </div>
</div>
{% endblock %}
